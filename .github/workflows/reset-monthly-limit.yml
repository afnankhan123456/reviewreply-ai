name: Reset Monthly Limit Cron

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  trigger-reset-monthly-limit:
    runs-on: ubuntu-latest
    steps:
      - name: Call reset-monthly-limit endpoint
        run: |
          curl -f -X GET "https://www.reviewreply-ai.in/api/reset-monthly-limit" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET_RESET_LIMIT }}"
