name: Expire Subscriptions Cron

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

jobs:
  trigger-expire-subscriptions:
    runs-on: ubuntu-latest
    steps:
      - name: Call expire-subscriptions endpoint
        run: |
          curl -f -X GET "https://www.reviewreply-ai.in/api/cron/expire-subscriptions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET_EXPIRE_SUBSCRIPTIONS }}"
